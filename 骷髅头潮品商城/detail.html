<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单品详情 - SKULL MALL 骷髅头潮品商城</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="topbar-left">
      <span>📍 配送至：江苏 南京市</span><span class="div">|</span>
      <a href="login.html">你好，请登录</a><a href="login.html" style="color:#e63946">免费注册</a>
    </div>
    <div class="topbar-left">
      <a href="user.html">我的订单</a><span class="div">|</span>
      <a href="cart.html">骨堆</a>
    </div>
  </div>
</div>

<header class="header">
  <div class="wrap header-main">
    <a href="index.html" class="logo">
      <div class="skull-mark" style="font-size:22px">💀</div>
      <div class="logo-text"><b>SKULL <i>MALL</i></b><span>骷髅潮品</span></div>
    </a>
    <div class="search">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索骷髅单品 / 品牌 / 系列">
        <button class="search-btn" onclick="doSearch()">SEARCH</button>
      </div>
    </div>
    <div class="header-actions">
      <a href="user.html" class="hact">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.8 3.4-6.4 7.5-6.4s7.5 2.6 7.5 6.4"/></svg>
        个人中心
      </a>
      <a href="user.html" class="hact">
        <svg viewBox="0 0 24 24"><path d="M12 4l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17.4 6.7 20.2l1.1-5.9L3.5 10.2l5.9-.8z"/></svg>
        我的收藏
      </a>
      <a href="cart.html" class="hact">
        <svg viewBox="0 0 24 24"><path d="M5 7h14l-1.3 12H6.3z"/><path d="M9 7a3 3 0 016 0"/></svg>
        骨堆（车）<span class="cart-badge">0</span>
      </a>
    </div>
  </div>
</header>

<nav class="nav">
  <div class="wrap">
    <a href="index.html">首页</a>
    <a href="list.html?cat=tee">骷髅T恤</a>
    <a href="list.html?cat=hoodie">连帽卫衣</a>
    <a href="list.html?cat=ring">骷髅饰品</a>
    <a href="list.html?cat=bag">骷髅箱包</a>
    <a href="list.html?cat=figure">骷髅摆件</a>
    <a href="list.html?cat=shoes">骷髅鞋靴</a>
    <a href="list.html?cat=deco">暗黑家居</a>
    <a href="list.html?cat=tool">骷髅工具</a>
    <a href="list.html?cat=tattoo">纹身贴纸</a>
    <a href="list.html?cat=vinyl">黑胶潮玩</a>
    <a href="list.html?sort=discount">☠ 死亡折扣</a>
  </div>
</nav>

<div class="wrap" id="detailWrap"></div>

<footer class="footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none">
      <div>© 2026 SKULL MALL 骷髅头潮品商城 · 演示站点，数据均为示例</div>
      <div class="links"><a href="#">用户协议</a><a href="#">隐私政策</a><a href="#">关于我们</a></div>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');
  const p = PRODUCTS.find(x => x.id === id) || PRODUCTS[0];
  document.title = p.name + ' - SKULL MALL';

  let curSpec = p.specs[0];
  let qty = 1;
  const discount = ((1 - p.price / p.oldPrice) * 100).toFixed(0);

  const GALLERY = [p.icon, '💀', '🦴', '☠'];

  document.getElementById('detailWrap').innerHTML = `
    <div class="crumb">
      <a href="index.html">首页</a> › <a href="list.html?cat=${p.cat}">${p.catName}</a> › <span>${p.sub}</span>
    </div>

    <div class="detail">
      <div class="detail-gallery">
        <div class="detail-main"><span id="mainImg">${p.icon}</span></div>
        <div class="thumbs" id="thumbs">
          ${GALLERY.map((g, i) => `<div class="thumb ${i === 0 ? 'on' : ''}" data-icon="${g}">${g}</div>`).join('')}
        </div>
      </div>

      <div class="detail-info">
        <h1 class="detail-title">${p.name}</h1>
        <div class="detail-sub">☠ ${p.slogan}</div>

        <div class="price-panel">
          <div class="p-row">
            <span style="font-size:11.5px;color:#6b6862;letter-spacing:2px">DEATH PRICE</span>
            <span class="big"><small>¥</small>${p.price.toLocaleString('zh-CN')}</span>
            <span class="price-old" style="font-size:14px">¥${p.oldPrice.toLocaleString('zh-CN')}</span>
            <span class="tag limit" style="font-size:11px">直降 ${discount}%</span>
          </div>
          <div class="meta">
            <span>已售 ${p.sales.toLocaleString('zh-CN')} 件</span>
            <span>好评率 ${(p.rating * 20).toFixed(0)}%</span>
            <span>累计评价 ${p.commentCount.toLocaleString('zh-CN')} 条</span>
              <span>库存 ${p.stock} 件</span>
          </div>
        </div>

        <div class="info-rows">
          <div class="r">
            <div class="k">优惠</div>
            <div class="v promo-tags">
              <span class="promo">满 199 减 40</span>
              <span class="promo">满 599 减 120</span>
              <span class="promo">新人再减 20</span>
            </div>
          </div>
          <div class="r"><div class="k">服务</div><div class="v">${p.services.join(' · ')}</div></div>
          <div class="r">
            <div class="k">送至</div>
            <div class="v">江苏 南京市 玄武区 · <span style="color:#00e5a0">现货，预计 9 月 15 日送达</span></div>
          </div>
          <div class="r"><div class="k">材质</div><div class="v">${p.material} · 品牌 ${p.brand}</div></div>
          <div class="r">
            <div class="k">规格</div>
            <div class="v spec-opts" id="specOpts">
              ${p.specs.map((s, i) => `<button class="spec ${i === 0 ? 'on' : ''}" data-spec="${s}">${s}</button>`).join('')}
            </div>
          </div>
          <div class="r">
            <div class="k">数量</div>
            <div class="v row gap12">
              <div class="qty">
                <button id="minus">−</button>
                <input id="qtyInput" value="1" readonly>
                <button id="plus">+</button>
              </div>
              <span style="font-size:11.5px;color:#6b6862">每人限购 10 件</span>
            </div>
          </div>
        </div>

        <div class="buy-actions">
          <button class="btn btn-lg" id="buyNow" style="flex:1;min-width:150px">立即结账</button>
          <button class="btn btn-lg btn-ghost" id="addCart" style="flex:1;min-width:150px">丢进骨堆</button>
          <button class="btn btn-lg btn-dark" id="favBtn">☆ 收藏</button>
        </div>
      </div>

      <aside class="detail-side">
        <div class="seller">
          <div class="shop">
            <div class="shop-logo">💀</div>
            <div>
              <b style="font-size:13.5px;color:#e8e6df;letter-spacing:1px">SKULL LAB 官方旗舰店</b>
              <div style="font-size:11.5px;color:#6b6862;margin-top:3px">暗黑潮牌 · 已入驻 6 年</div>
            </div>
          </div>
          <div class="stat">
            <div><b>4.9</b><span>商品描述</span></div>
            <div><b>4.9</b><span>服务态度</span></div>
            <div><b>4.8</b><span>物流速度</span></div>
          </div>
          <div style="margin-top:16px;display:flex;flex-direction:column;gap:9px">
            <a href="list.html?cat=${p.cat}" class="btn btn-ghost btn-sm btn-block">进入店铺</a>
            <a href="#" class="btn btn-dark btn-sm btn-block">召唤客服</a>
          </div>
        </div>

        <div class="side-card">
          <div style="font-size:12px;font-weight:600;color:#e8e6df;letter-spacing:2px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #262a35">
            ☠ 墓友还看了
          </div>
          <div id="alsoLike" style="display:flex;flex-direction:column;gap:12px"></div>
        </div>
      </aside>
    </div>

    <div class="tabs" id="tabs">
      <button data-tab="0" class="on">单品详情</button>
      <button data-tab="1">规格参数</button>
      <button data-tab="2">累计评价 (${p.commentCount})</button>
      <button data-tab="3">售后保障</button>
    </div>
    <div class="tab-panel" id="tabPanel"></div>

    <section class="section">
      <div class="sec-head">
        <div class="sec-title"><h3>同墓<em>推荐</em></h3><span>同类目热销骨料</span></div>
      </div>
      <div class="grid grid-5" id="relGrid"></div>
    </section>
  `;

  /* 图片切换 */
  document.getElementById('thumbs').addEventListener('click', e => {
    const t = e.target.closest('.thumb'); if (!t) return;
    $$('.thumb').forEach(x => x.classList.toggle('on', x === t));
    document.getElementById('mainImg').textContent = t.dataset.icon;
  });

  /* 规格 */
  document.getElementById('specOpts').addEventListener('click', e => {
    const b = e.target.closest('.spec'); if (!b) return;
    curSpec = b.dataset.spec;
    $$('.spec').forEach(x => x.classList.toggle('on', x === b));
  });

  /* 数量 */
  const qi = document.getElementById('qtyInput');
  document.getElementById('minus').onclick = () => { qty = Math.max(1, qty - 1); qi.value = qty; };
  document.getElementById('plus').onclick = () => { qty = Math.min(10, qty + 1); qi.value = qty; };

  /* 操作 */
  document.getElementById('addCart').onclick = () => { Cart.add(p.id, qty, curSpec); toast('☠ 已丢进骨堆'); };
  document.getElementById('buyNow').onclick = () => { Cart.add(p.id, qty, curSpec); location.href = 'cart.html'; };
  document.getElementById('favBtn').onclick = function () {
    const on = this.textContent.includes('☆');
    this.textContent = on ? '★ 已收藏' : '☆ 收藏';
    toast(on ? '❤ 已加入收藏墓穴' : '已取消收藏');
  };

  /* 标签页内容 */
  const PANELS = [
    `<h3 style="margin-bottom:16px;color:#e8e6df;letter-spacing:1px">${p.name}</h3>
     ${DETAIL_TEXT.map(([t, c]) => `
       <p style="margin-bottom:14px;line-height:1.9;color:#9a978f">
         <b style="color:#e63946;letter-spacing:1px">${t}</b>${c}
       </p>`).join('')}
     <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px">
       ${[p.icon, '💀', '🦴', '⚰️', '🕸️', '🕯️'].map(g => `
         <div style="aspect-ratio:4/3;border:1px solid #262a35;display:grid;place-items:center;font-size:58px;
              background:radial-gradient(circle at 50% 45%, #1e212a, #0a0b10);filter:grayscale(.3)">${g}</div>`).join('')}
     </div>`,

    `<table class="spec-table">
      <tr><td>单品名称</td><td>${p.name}</td><td>品牌</td><td>${p.brand}</td></tr>
      <tr><td>商品编号</td><td>${p.id}</td><td>所属系列</td><td>${p.catName} / ${p.sub}</td></tr>
      <tr><td>上架时间</td><td>${p.created}</td><td>库存</td><td>${p.stock} 件</td></tr>
      <tr><td>主要材质</td><td>${p.material}</td><td>可选规格</td><td>${p.specs.join(' / ')}</td></tr>
      <tr><td>颜色</td><td>炭黑 / 骨白 / 血锈红 / 暗夜紫</td><td>产地</td><td>中国</td></tr>
      <tr><td>包装清单</td><td>主体 × 1、骷髅吊牌 × 1、收纳袋 × 1、养护卡 × 1</td><td>重量</td><td>约 ${(p.price % 7 + 2) / 10 + 0.3} kg</td></tr>
      <tr><td>保养建议</td><td colspan="3">避免长时间暴晒，金属件请勿接触酸碱液体；建议用软布擦拭，单独收纳防止刮擦。</td></tr>
    </table>`,

    `<div style="display:flex;gap:24px;align-items:center;padding-bottom:20px;border-bottom:1px solid #262a35;flex-wrap:wrap">
       <div style="text-align:center">
         <div style="font-size:46px;color:#e63946;font-weight:700;font-family:Oswald,Impact,sans-serif;text-shadow:0 0 22px rgba(193,18,31,.5)">
           ${(p.rating * 20).toFixed(0)}<span style="font-size:15px">%</span>
         </div>
         <div style="font-size:11.5px;color:#6b6862;letter-spacing:1px">好评率</div>
       </div>
       <div style="display:flex;gap:8px;flex-wrap:wrap">
         <span class="promo">做工扎实 286</span><span class="promo">印花清晰 241</span>
         <span class="promo">物流很快 208</span><span class="promo">够暗黑 176</span>
         <span class="promo">客服耐心 92</span>
       </div>
     </div>
     ${REVIEWS.map(r => `
       <div class="review">
         <div class="av">${r.glyph}</div>
         <div style="flex:1;min-width:0">
           <div class="row gap12">
             <span class="nm">${r.user}</span>
             <span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span>
           </div>
           <div class="txt">${r.text}</div>
           ${r.imgs.length ? `<div class="img-row">${r.imgs.map(i => `<div>${i}</div>`).join('')}</div>` : ''}
           <div style="font-size:11.5px;color:#6b6862;margin-top:9px">
             2026-09-${10 + r.stars} · ${p.specs[0]} · ${p.material}
           </div>
         </div>
       </div>`).join('')}`,

    `<div style="line-height:2;color:#9a978f">
       <p><b style="color:#e8e6df">▎七天无理由退换</b><br>自签收之日起 7 天内，商品保持完好、不影响二次销售的前提下，可申请无理由退换货，退货运费由平台承担。</p>
       <p class="mt16"><b style="color:#e8e6df">▎正品保障</b><br>本店所有单品均为品牌方授权或自营采购，支持专柜验货，假一赔十。</p>
       <p class="mt16"><b style="color:#e8e6df">▎价格保护</b><br>下单后 15 天内，若同一单品在同平台出现降价，可申请差价补偿。</p>
       <p class="mt16"><b style="color:#e8e6df">▎售后维修</b><br>饰品与工具类提供 12 个月质保，如需维修可在线申请上门取件，进度实时可查。</p>
       <p class="mt16"><b style="color:#e8e6df">▎发票说明</b><br>支持开具电子普通发票与增值税专用发票，下单时填写抬头信息即可。</p>
       <p class="mt16"><b style="color:#e8e6df">▎隐私配送</b><br>所有订单均采用无标识素色外包装，不显示商品名称，保护你的收件隐私。</p>
     </div>`
  ];
  const panel = document.getElementById('tabPanel');
  function setTab(i) {
    panel.innerHTML = PANELS[i];
    $$('#tabs button').forEach(b => b.classList.toggle('on', +b.dataset.tab === i));
  }
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) setTab(+b.dataset.tab);
  });
  setTab(0);

  /* 墓友还看了 */
  const also = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4);
  document.getElementById('alsoLike').innerHTML = also.map(x => `
    <a href="detail.html?id=${x.id}" style="display:flex;gap:11px;align-items:center">
      <div style="width:52px;height:52px;border:1px solid #262a35;display:grid;place-items:center;font-size:24px;flex-shrink:0;background:#0e0f14">${x.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;line-height:1.45;color:#d8d6cf;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${x.name}</div>
        <div style="color:#e63946;font-weight:700;font-size:14px;font-family:Oswald,sans-serif;margin-top:3px">¥${x.price.toLocaleString('zh-CN')}</div>
      </div>
    </a>`).join('');

  /* 推荐 */
  const rel = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 5);
  renderCards(document.getElementById('relGrid'), rel.length ? rel : hotList(5));

  function doSearch() {
    const kw = document.getElementById('searchInput').value.trim();
    location.href = 'list.html' + (kw ? '?q=' + encodeURIComponent(kw) : '');
  }
  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>

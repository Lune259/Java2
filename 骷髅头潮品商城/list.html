<script src="js/data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const state = {
    cat: params.get('cat') || 'all',
    q: params.get('q') || '',
    brand: 'all',
    price: 'all',
    mat: 'all',
    serv: 'all',
    sort: params.get('sort') || 'default',
    page: 1,
    size: 20,
  };

  document.getElementById('searchInput').value = state.q;

  const catObj = CATEGORIES.find(c => c.id === state.cat);
  document.getElementById('crumbCat').textContent =
    catObj ? catObj.name : (state.q ? '搜索「' + state.q + '」' : '全部单品');
  document.title = (catObj ? catObj.name : '全部单品') + ' - SKULL MALL';
  $$('.nav a').forEach(a => {
    if (catObj && a.getAttribute('href').includes('cat=' + catObj.id)) a.classList.add('on');
  });

  /* 品牌筛选 */
  document.getElementById('brandFilter').innerHTML = ['all', ...BRANDS].map(b =>
    `<a href="#" data-brand="${b}" class="${b === 'all' ? 'on' : ''}">${b === 'all' ? '全部' : b}</a>`).join('');

  /* 材质筛选 */
  const MATS = ['纯棉', '钛钢', '925银', '树脂', '皮革', '不锈钢', '合金', 'PVC'];
  document.getElementById('matFilter').innerHTML = ['all', ...MATS].map(m =>
    `<a href="#" data-mat="${m}" class="${m === 'all' ? 'on' : ''}">${m === 'all' ? '全部' : m}</a>`).join('');

  document.getElementById('brandFilter').addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    state.brand = a.dataset.brand; state.page = 1;
    $$('#brandFilter a').forEach(x => x.classList.toggle('on', x === a));
    render();
  });
  document.getElementById('matFilter').addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    state.mat = a.dataset.mat; state.page = 1;
    $$('#matFilter a').forEach(x => x.classList.toggle('on', x === a));
    render();
  });
  $$('.filter-opts').forEach(row => {
    row.addEventListener('click', e => {
      const a = e.target.closest('a'); if (!a) return;
      if (a.dataset.price) {
        e.preventDefault();
        state.price = a.dataset.price; state.page = 1;
        $$('[data-price]').forEach(x => x.classList.toggle('on', x === a));
        render();
      }
      if (a.dataset.serv) {
        e.preventDefault();
        state.serv = a.dataset.serv; state.page = 1;
        $$('[data-serv]').forEach(x => x.classList.toggle('on', x === a));
        render();
      }
    });
  });
  $$('.sorts button').forEach(b => {
    b.onclick = () => {
      state.sort = b.dataset.sort; state.page = 1;
      $$('.sorts button').forEach(x => x.classList.toggle('on', x === b));
      render();
    };
  });
  const initSort = $$('.sorts button').find(b => b.dataset.sort === state.sort);
  if (initSort) { $$('.sorts button').forEach(x => x.classList.remove('on')); initSort.classList.add('on'); }

  function filtered() {
    let list = PRODUCTS.slice();
    if (state.cat !== 'all') list = list.filter(p => p.cat === state.cat);
    if (state.q) {
      const kw = state.q.toLowerCase();
      list = list.filter(p => (p.name + p.brand + p.sub + p.catName + p.material).toLowerCase().includes(kw));
    }
    if (state.brand !== 'all') list = list.filter(p => p.brand === state.brand);
    if (state.mat !== 'all') list = list.filter(p => p.material === state.mat);
    if (state.price !== 'all') {
      const [lo, hi] = state.price.split('-').map(Number);
      list = list.filter(p => p.price >= lo && p.price <= hi);
    }
    if (state.serv !== 'all') list = list.filter(p => p.services.includes(state.serv));

    switch (state.sort) {
      case 'sales': list.sort((a, b) => b.sales - a.sales); break;
      case 'new': list.sort((a, b) => a.created < b.created ? 1 : -1); break;
      case 'price-asc': list.sort((a, b) => a.price - b.price); break;
      case 'price-desc': list.sort((a, b) => b.price - a.price); break;
      case 'discount': list.sort((a, b) => (b.oldPrice - b.price) / b.oldPrice - (a.oldPrice - a.price) / a.oldPrice); break;
      case 'rating': list.sort((a, b) => b.rating - a.rating); break;
    }
    return list;
  }

  function render() {
    const list = filtered();
    document.getElementById('cnt').textContent = list.length;
    const pages = Math.max(1, Math.ceil(list.length / state.size));
    if (state.page > pages) state.page = pages;
    const slice = list.slice((state.page - 1) * state.size, state.page * state.size);

    const grid = document.getElementById('listGrid');
    if (!slice.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div class="big">💀</div>
        <p>墓园里没有符合条件的骨料，换个条件看看？</p>
        <a href="list.html" class="btn btn-ghost">重置筛选</a>
      </div>`;
    } else {
      renderCards(grid, slice);
    }

    let html = `<button ${state.page === 1 ? 'disabled' : ''} data-p="${state.page - 1}">上一页</button>`;
    const s = Math.max(1, state.page - 2), e = Math.min(pages, s + 4);
    for (let i = s; i <= e; i++) html += `<button class="${i === state.page ? 'on' : ''}" data-p="${i}">${i}</button>`;
    html += `<button ${state.page === pages ? 'disabled' : ''} data-p="${state.page + 1}">下一页</button>`;
    html += `<span style="align-self:center;font-size:12px;color:#6b6862;margin-left:10px">共 ${pages} 页</span>`;
    document.getElementById('pager').innerHTML = html;
  }

  document.getElementById('pager').addEventListener('click', e => {
    const b = e.target.closest('button[data-p]'); if (!b || b.disabled) return;
    state.page = +b.dataset.p;
    render();
    window.scrollTo({ top: 280, behavior: 'smooth' });
  });

  function doSearch() {
    state.q = document.getElementById('searchInput').value.trim();
    state.cat = 'all'; state.page = 1;
    document.getElementById('crumbCat').textContent = state.q ? '搜索「' + state.q + '」' : '全部单品';
    render();
  }
  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  render();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 - SKULL MALL 骷髅头潮品商城</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="topbar-left">
      <span>📍 配送至：江苏 南京市</span><span class="div">|</span>
      <a href="login.html">退出登录</a>
    </div>
    <div class="topbar-left">
      <a href="cart.html">我的骨堆</a><span class="div">|</span>
      <a href="index.html">返回首页</a>
    </div>
  </div>
</div>

<header class="header">
  <div class="wrap header-main">
    <a href="index.html" class="logo">
      <div class="skull-mark" style="font-size:22px">💀</div>
      <div class="logo-text"><b>SKULL <i>MALL</i></b><span>骷髅潮品</span></div>
    </a>
    <div class="search">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索骷髅单品 / 品牌 / 系列">
        <button class="search-btn" onclick="doSearch()">SEARCH</button>
      </div>
    </div>
    <div class="header-actions">
      <a href="user.html" class="hact">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.8 3.4-6.4 7.5-6.4s7.5 2.6 7.5 6.4"/></svg>
        个人中心
      </a>
      <a href="cart.html" class="hact">
        <svg viewBox="0 0 24 24"><path d="M5 7h14l-1.3 12H6.3z"/><path d="M9 7a3 3 0 016 0"/></svg>
        骨堆（车）<span class="cart-badge">0</span>
      </a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="crumb"><a href="index.html">首页</a> › <span>个人中心</span></div>

  <div class="uc">
    <aside class="uc-side">
      <div class="u">
        <div class="av">💀</div>
        <div style="min-width:0">
          <b style="font-size:13.5px;color:#e8e6df;letter-spacing:1px">骨灰级会员</b>
          <div style="font-size:11px;color:#6b6862;margin-top:3px">DEATH VIP · 有效期至 2027-09</div>
        </div>
      </div>
      <ul id="ucMenu">
        <li><a href="#" class="on" data-sec="orders">⚰️ 我的订单</a></li>
        <li><a href="#" data-sec="coupons">🎫 优惠券 <span style="margin-left:auto;color:#e63946">6</span></a></li>
        <li><a href="#" data-sec="fav">🖤 我的收藏</a></li>
        <li><a href="#" data-sec="addr">📍 收货地址</a></li>
        <li><a href="#" data-sec="points">🦴 骷髅币</a></li>
        <li><a href="#" data-sec="setting">⚙️ 账号设置</a></li>
      </ul>
    </aside>

    <main class="uc-main">
      <div class="uc-stats">
        <div class="uc-stat"><b>4</b><span>待付款</span></div>
        <div class="uc-stat"><b>3</b><span>待收货</span></div>
        <div class="uc-stat"><b>18</b><span>待评价</span></div>
        <div class="uc-stat"><b>666</b><span>骷髅币</span></div>
      </div>
      <div class="panel" id="panel"></div>
    </main>
  </div>

  <section class="section">
    <div class="sec-head">
      <div class="sec-title"><h3>为你<em>挖坟</em></h3><span>根据你的浏览印记推荐</span></div>
    </div>
    <div class="grid grid-5" id="recGrid"></div>
  </section>
</div>

<footer class="footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none">
      <div>© 2026 SKULL MALL 骷髅头潮品商城 · 演示站点，数据均为示例</div>
      <div class="links"><a href="#">用户协议</a><a href="#">隐私政策</a></div>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
  const statuses = ['待付款', '待发货', '待收货', '已完成', '已完成'];
  const orders = hotList(5).map((p, i) => ({
    no: 'SK' + (20260914000 + i * 313),
    status: statuses[i],
    time: '2026-09-' + (14 - i) + ' 1' + (i + 1) + ':3' + i,
    p,
    qty: (i % 3) + 1,
  }));

  const SEC = {
    orders: () => `
      <div class="panel-head">
        <h3>我的订单</h3>
        <div class="row gap8">
          <a href="#" class="btn btn-sm btn-dark">全部订单</a>
          <a href="list.html?sort=sales" class="btn btn-sm btn-dark">再抓一件</a>
        </div>
      </div>
      ${orders.map((o, i) => `
        <div class="order">
          <div class="order-head">
            <div class="no">订单号 ${o.no} · 下单时间 ${o.time}</div>
            <div class="st">${o.status}</div>
          </div>
          <div class="order-body">
            <div class="cart-thumb">${o.p.icon}</div>
            <div style="flex:1;min-width:0">
              <a href="detail.html?id=${o.p.id}" style="font-size:13.5px;color:#d8d6cf">${o.p.name}</a>
              <div style="font-size:11.5px;color:#6b6862;margin-top:4px">
                规格 ${o.p.specs[0]} · 数量 ×${o.qty} · ${o.p.brand} · ${o.p.material}
              </div>
            </div>
            <div class="cart-sub">¥${(o.p.price * o.qty).toLocaleString('zh-CN')}</div>
          </div>
          <div class="order-foot">
            <div class="sum">共 ${o.qty} 件，实付 <b>¥${(o.p.price * o.qty).toLocaleString('zh-CN')}</b></div>
            <button class="btn btn-sm btn-dark" data-act="查看物流">查看物流</button>
            ${o.status === '待付款'
              ? `<button class="btn btn-sm" data-act="立即付款">立即付款</button>`
              : `<button class="btn btn-sm btn-ghost" data-act="再次购买">再次购买</button>`}
          </div>
        </div>`).join('')}`,

    coupons: () => `
      <div class="panel-head"><h3>我的优惠券</h3></div>
      <div class="grid grid-3">
        ${[
          { v: 40, c: '满 199 可用', n: '全场通用券', d: '2026-09-30 到期' },
          { v: 120, c: '满 599 可用', n: '卫衣专享券', d: '2026-10-15 到期' },
          { v: 20, c: '无门槛', n: '新人首单券', d: '2026-09-20 到期' },
          { v: 80, c: '满 399 可用', n: '银饰品类券', d: '2026-11-01 到期' },
          { v: 200, c: '满 999 可用', n: '摆件大额券', d: '2026-10-31 到期' },
          { v: 300, c: '满 1599 可用', n: '骨灰会员专属券', d: '2026-12-31 到期' },
        ].map(t => `
          <div style="border:1px solid rgba(193,18,31,.4);padding:16px;background:linear-gradient(120deg,rgba(193,18,31,.12),transparent)">
            <div style="display:flex;align-items:baseline;gap:4px;color:#e63946">
              <span style="font-size:14px">¥</span>
              <b style="font-size:32px;font-family:Oswald,Impact,sans-serif;text-shadow:0 0 18px rgba(193,18,31,.45)">${t.v}</b>
              <span style="font-size:11.5px;margin-left:8px;color:#9a978f">${t.c}</span>
            </div>
            <div style="font-size:13.5px;color:#d8d6cf;margin-top:8px;letter-spacing:.5px">${t.n}</div>
            <div style="font-size:11.5px;color:#6b6862;margin-top:5px">${t.d}</div>
            <button class="btn btn-sm btn-ghost btn-block" style="margin-top:12px" data-act="去使用">去使用</button>
          </div>`).join('')}
      </div>`,

    fav: () => `
      <div class="panel-head">
        <h3>我的收藏</h3>
        <a href="list.html?sort=sales" class="btn btn-sm btn-dark">看看骨头榜</a>
      </div>
      <div class="grid grid-4">${hotList(8).map(cardHTML).join('')}</div>`,

    addr: () => `
      <div class="panel-head">
        <h3>收货地址</h3>
        <button class="btn btn-sm" data-act="新增地址">+ 新增地址</button>
      </div>
      ${[
        { n: '骨灰级会员', tel: '138****6688', a: '江苏省 南京市 玄武区 中山东路 100 号 星辰大厦 18 层', def: 1 },
        { n: '骨灰级会员', tel: '138****6688', a: '上海市 浦东新区 张江高科技园区 博云路 2 号 A 座 1203', def: 0 },
        { n: '小布', tel: '159****2233', a: '广东省 深圳市 南山区 科技园南路 55 号 3 栋 902', def: 0 },
      ].map(x => `
        <div style="border:1px solid ${x.def ? '#c1121f' : '#262a35'};padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div style="font-size:13.5px;color:#e8e6df">
              <b>${x.n}</b>
              <span style="color:#9a978f;margin-left:12px">${x.tel}</span>
              ${x.def ? '<span class="tag" style="margin-left:12px">默认</span>' : ''}
            </div>
            <div style="font-size:12.5px;color:#9a978f;margin-top:7px">${x.a}</div>
          </div>
          <button class="btn btn-sm btn-dark" data-act="编辑">编辑</button>
          <button class="btn btn-sm btn-dark" data-act="删除">删除</button>
        </div>`).join('')}`,

    points: () => `
      <div class="panel-head"><h3>我的骷髅币</h3></div>
      <div style="border:1px solid rgba(193,18,31,.4);padding:26px;margin-bottom:20px;
           background:linear-gradient(120deg,rgba(193,18,31,.18),transparent 70%)">
        <div style="font-size:11.5px;color:#9a978f;letter-spacing:3px;text-transform:uppercase">当前可用骷髅币</div>
        <div style="font-size:48px;font-weight:700;color:#e63946;font-family:Oswald,Impact,sans-serif;
             text-shadow:0 0 28px rgba(193,18,31,.5);margin-top:6px">666</div>
        <div style="font-size:12px;color:#9a978f;margin-top:10px;line-height:1.8">
          100 骷髅币 = 1 元，结算时可直接抵扣，单笔最高抵扣订单金额的 20%。<br>
          每日签到 +5，晒单评价 +50，邀请好友 +100。
        </div>
        <button class="btn btn-sm mt16" data-act="立即签到">立即签到 +5</button>
      </div>
      <table class="spec-table">
        <tr><td>2026-09-14</td><td>下单返骷髅币</td><td style="color:#00e5a0">+166</td></tr>
        <tr><td>2026-09-13</td><td>每日签到</td><td style="color:#00e5a0">+5</td></tr>
        <tr><td>2026-09-10</td><td>晒单评价奖励</td><td style="color:#00e5a0">+50</td></tr>
        <tr><td>2026-09-05</td><td>邀请好友「墓友阿骨」</td><td style="color:#00e5a0">+100</td></tr>
        <tr><td>2026-08-28</td><td>骷髅币抵扣消费</td><td style="color:#e63946">-500</td></tr>
        <tr><td>2026-08-20</td><td>骨灰会员双倍返还</td><td style="color:#00e5a0">+240</td></tr>
      </table>`,

    setting: () => `
      <div class="panel-head"><h3>账号设置</h3></div>
      <div style="max-width:440px">
        <div class="field"><label>昵称</label><input class="input" value="骨灰级会员"></div>
        <div class="field"><label>手机号</label><input class="input" value="138****6688"></div>
        <div class="field"><label>邮箱</label><input class="input" value="skull@example.com"></div>
        <div class="field"><label>生日</label><input class="input" value="1996-09-14"></div>
        <div class="field">
          <label>常买尺码</label>
          <div class="spec-opts">
            <button class="spec">S</button><button class="spec">M</button>
            <button class="spec on">L</button><button class="spec">XL</button>
          </div>
        </div>
        <div class="field">
          <label>接收暗黑推送</label>
          <label class="row gap8" style="cursor:pointer;color:#9a978f">
            <input type="checkbox" checked> 开启后可第一时间收到降价与新品空投提醒
          </label>
        </div>
        <div class="row gap12 mt16" style="flex-wrap:wrap">
          <button class="btn" data-act="保存设置">保存设置</button>
          <button class="btn btn-dark" data-act="退出登录">退出登录</button>
        </div>
      </div>`,
  };

  const panel = document.getElementById('panel');
  function setSec(key) {
    panel.innerHTML = SEC[key]();
    Cart.syncBadge();
    $$('#panel .spec').forEach(s => s.onclick = () => {
      $$('#panel .spec').forEach(x => x.classList.toggle('on', x === s));
    });
  }

  document.getElementById('ucMenu').addEventListener('click', e => {
    const a = e.target.closest('a[data-sec]'); if (!a) return;
    e.preventDefault();
    $$('#ucMenu a').forEach(x => x.classList.toggle('on', x === a));
    setSec(a.dataset.sec);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === '退出登录') { location.href = 'login.html'; return; }
    toast('「' + act + '」演示操作已完成');
  });

  setSec('orders');
  renderCards(document.getElementById('recGrid'), newList(5));

  function doSearch() {
    const kw = document.getElementById('searchInput').value.trim();
    location.href = 'list.html' + (kw ? '?q=' + encodeURIComponent(kw) : '');
  }
  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
